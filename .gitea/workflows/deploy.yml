name: Deploy

on:
  push:
    branches:
      - public

jobs:
  deploy:
    runs-on: ubuntu-latest

    container:
      image: docker:dind
      options: --privileged

    steps:
      - name: Install Dependencies
        run: apk add --no-cache git openssh bash nodejs

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.20"

      - name: Get Cargo.lock Hash
        uses: actions/go-hashfiles@v0.0.1
        id: get-hash
        with:
          patterns: |
            **/Cargo.lock

      - name: Echo Hash
        run: echo ${{ steps.get-hash.outputs.hash }}

      - name: Restore Cargo Cache
        uses: actions/cache@v3
        with:
          path: /tmp/docker-cache/cargo-registry
          key: ${{ runner.os }}-cargo-${{ steps.get-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Restore Rust Build Cache
        uses: actions/cache@v3
        with:
          path: /tmp/docker-cache/rust-build
          key: ${{ runner.os }}-rust-build-${{ steps.get-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-rust-build-

      - name: Build Docker Image
        run: docker build -t bottle-server:latest .

      - name: Restart Service
        run: docker service update --force ${{ secrets.SERVICE_NAME }} || true
